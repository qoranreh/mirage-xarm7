xarm_state_monitor:
  ros__parameters:
    joint_states_topic: /joint_states
    robot_states_topic: /xarm/robot_states
    base_frame: link_base
    ee_frame: link_eef
    arm_joint_names:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
